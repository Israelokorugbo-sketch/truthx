services:
    - type: web
    name: truthx-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: Truthx_db
          property: connectionString
            - key: JWT_SECRET
        generateValue: true
            - key: PORT
        value: 8000
    healthCheckPath: /health

databases:
    - name: Truthx_db
    plan: free
    databaseName: truthx_db
    user: truthx_db_user
